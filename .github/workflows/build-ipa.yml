name: Build Unsigned IPA

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: "构建目标（tvos = Apple TV，ios = iPhone/iPad）"
        type: choice
        options:
          - tvos
          - ios
        default: tvos
      release_tag:
        description: "发布到哪个 Release 标签（默认 unsigned-latest，保持地址不变）"
        type: string
        required: false
        default: "unsigned-latest"

permissions:
  contents: write

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned ${{ inputs.platform || 'tvos' }} IPA
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Generate native project
        env:
          EXPO_TV: ${{ (inputs.platform || 'tvos') == 'tvos' && '1' || '' }}
        run: npx expo prebuild --clean --platform ios

      - name: Resolve Xcode scheme
        id: scheme
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          SCHEMES=$(xcodebuild -workspace "$WORKSPACE" -list -json 2>/dev/null | python3 -c "import json,sys; raw=sys.stdin.read(); print(' '.join(json.loads(raw[raw.find('{'):])['workspace']['schemes']))")
          echo "schemes=$SCHEMES"
          for candidate in OrionTV OrionTV-tvOS; do
            if echo " $SCHEMES " | grep -q " $candidate "; then
              echo "scheme=$candidate" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "scheme=$(echo $SCHEMES | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Build unsigned app
        env:
          SDK: ${{ (inputs.platform || 'tvos') == 'tvos' && 'appletvos' || 'iphoneos' }}
          DESTINATION: ${{ (inputs.platform || 'tvos') == 'tvos' && 'generic/platform=tvOS' || 'generic/platform=iOS' }}
        run: |
          xcodebuild \
            -workspace "${{ steps.scheme.outputs.workspace }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk "$SDK" \
            -destination "$DESTINATION" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        env:
          VERSION: ${{ steps.package-version.outputs.version }}
          PLATFORM: ${{ inputs.platform || 'tvos' }}
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到构建产物 .app"
            ls -R build/Build/Products
            exit 1
          fi
          echo "APP_PATH=$APP_PATH"

          mkdir -p artifacts release Payload
          cp -R "$APP_PATH" Payload/

          # 带版本号的产物，作为 Actions Artifact 留档
          zip -qry "artifacts/orionTV.$VERSION.$PLATFORM.unsigned.ipa" Payload
          rm -rf Payload
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "artifacts/orionTV.$VERSION.$PLATFORM.unsigned.app.zip"

          # 固定文件名的产物，覆盖到常驻 Release，保证下载地址不变
          cp "artifacts/orionTV.$VERSION.$PLATFORM.unsigned.ipa" "release/orionTV-unsigned-$PLATFORM.ipa"
          cp "artifacts/orionTV.$VERSION.$PLATFORM.unsigned.app.zip" "release/orionTV-unsigned-$PLATFORM.app.zip"

          ls -lh artifacts release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orionTV-${{ inputs.platform || 'tvos' }}-unsigned
          path: artifacts/
          retention-days: 30

      - name: Move release tag to this commit
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag || 'unsigned-latest' }}"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'unsigned-latest' }}
          target_commitish: ${{ github.sha }}
          name: 未签名安装包（持续更新）
          body: |
            每次 `master`/`main` 更新都会自动重新构建并覆盖此 Release 中的安装包，下载地址始终不变。
            安装包未签名，安装到设备前需要用 Sideloadly、AltStore 等工具以你自己的开发者证书重签。

            - 版本：${{ steps.package-version.outputs.version }}
            - 目标：${{ inputs.platform || 'tvos' }}
            - 提交：${{ github.sha }}
            - 构建时间：${{ github.run_started_at }}
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
