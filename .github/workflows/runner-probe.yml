name: Runner Probe
on:
  workflow_dispatch:
jobs:
  probe:
    name: Probe ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - run: uname -m && xcodebuild -version && xcrun --sdk appletvos --show-sdk-version
